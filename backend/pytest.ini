[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    --cov=face_engines
    --cov=publish_sidecar
    --cov-report=term-missing
    --cov-report=lcov:coverage.lcov
    --strict-markers
    --cov-fail-under=52
markers =
    models: requires downloaded ML model weights (InsightFace buffalo_l, HSEmotion); skipped in CI
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
