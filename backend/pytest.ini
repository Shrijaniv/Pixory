[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    --cov=face_engines
    --cov=publish_sidecar
    --cov-report=term-missing
    --cov-report=lcov:coverage.lcov
    --strict-markers
    --cov-fail-under=57
    -m "not models"
# `-m "not models"` is in the default addopts on purpose. Those tests need
# ~300MB of model weights that CI cannot download, so CI always deselects
# them. Making that the local default too means the coverage number a
# developer sees is the same one the gate is measured against — otherwise a
# threshold ratcheted from a local run fails in CI, which is exactly what
# happened on PR #20.
#
# To run them locally once the weights are present:  pytest -m models
markers =
    models: requires downloaded ML model weights (InsightFace buffalo_l, HSEmotion); deselected by default
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
